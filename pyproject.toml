[project]
name = "chaturanga"
version = "0.1.0"
description = "Under this monarch, only the bees quarreled to collect the dew; the only feet cut off were those of measurements, and only from Ashtâpada one could learn how to draw up a chaturanga, there was no cutting-off of the four limbs of condemned criminals"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "chess>=1.11.2",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.17.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "sqlmodel>=0.0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
